app: ultreyapp
accessory: backup
databases:
  - name: primary
    adapter: sqlite
    path: /data/storage/production.sqlite3
  - name: queue
    adapter: sqlite
    path: /data/storage/production_queue.sqlite3
# Active Storage objects live in Spaces and need a separate backup process.
paths: []
restic:
  repository: s3:https://sfo3.digitaloceanspaces.com/ultreyapp-backups-standard
  password:
    secret: RESTIC_PASSWORD
  init_if_missing: true
  check_after_backup: true
  check_read_data_subset: 5%
  forget_after_backup: true
  retention:
    keep_last: 24
    keep_daily: 30
    keep_weekly: 4
    keep_monthly: 12
    keep_yearly: 0
backup:
  schedule: 1h
