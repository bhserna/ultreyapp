- topic: Coro y música
  questions:
  - question: ¿En qué momentos participa el coro y qué repertorio se solicita?
    answer: Participará en una de las misas, pero todavía no se sabe en cuál; faltan otras intervenciones y
      el repertorio.
  - question: ¿En cuál Eucaristía cantará?
    answer: null
  - question: ¿Habrá otros coros o grupos de animación, incluido Jessed?
    answer: Sí. Participarán Jessed y otras tres personas por separado; faltan sus momentos y la coordinación.
  - question: ¿Qué equipo estará disponible y permanecerá fijo?
    answer: Los instrumentos de todos los coros estarán montados todo el tiempo en el escenario; los micrófonos,
      conexiones y demás equipo siguen sin definirse.
  - question: ¿Cómo se comparte escenario/equipo con otros grupos?
    answer: Los instrumentos de todos los coros estarán montados todo el tiempo en el escenario. Parece que
      cada coro entrará y saldrá cuando le toque participar; falta confirmarlo.
  - question: ¿Quién aprueba canciones y coordina ensayos?
    answer: Emmanuel coordina los ensayos; todavía no se define quién aprueba las canciones.
  - question: ¿El reclutamiento será mediante vocales y cuántas personas se requieren?
    answer: Sí. Emmanuel redactará la convocatoria, los vocales identificarán a personas que animan cantos
      en sus centros y le pasarán sus contactos. Emmanuel convocará a una reunión de integración y después
      se definirá el calendario de ensayos. La cantidad de integrantes sigue sin definirse.
  - question: ¿Se necesita vestuario especial?
    answer: null
  - question: ¿Cómo se conecta el coro al audio del evento?
    answer: null
- topic: Escenografía
  questions:
  - question: ¿Qué se mostrará en la pantalla frontal?
    answer: Imágenes para ambientar los diferentes momentos de la Ultreya; falta definir el contenido concreto.
  - question: ¿Quién prepara y entrega los materiales visuales?
    answer: Marketing proporcionará la mayoría de las imágenes y preparará una carpeta para cada video con
      su orden correspondiente.
  - question: ¿Qué medidas tiene la pantalla?
    answer: Aproximadamente 10 x 10 metros; falta confirmar la medida y la resolución reales.
  - question: ¿Qué medidas tiene el escenario?
    answer: Aproximadamente 18 x 12 metros; falta confirmar su orientación y distribución.
  - question: ¿Dónde estará la Santísima Virgen?
    answer: Hilda, de Liturgia, indicó que siempre habrá un lugar para la Santísima Virgen en el escenario;
      la ubicación exacta sigue sin definirse.
